
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <p class="tag">CLOUD & DEVOPS PROJECT</p>
            <h1>Student Task Manager</h1>
            <p class="subtitle">Organize your learning, one task at a time.</p>
        </header>

        <div class="input-box">
            <input id="taskInput" type="text" placeholder="What do you need to do?">
            <button id="addBtn">+ Add Task</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedCount">0</h2>
            </div>
            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingCount">0</h2>
            </div>
        </div>

        <h3>My Tasks</h3>
        <div id="taskList"></div>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>

        <footer>
            Built with Python, Flask & SQLite
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
